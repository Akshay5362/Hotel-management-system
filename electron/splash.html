<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading Webline PMS...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #0d1117; /* Matches main window to prevent flash */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-app-region: drag; /* Allows moving the borderless splash screen */
      user-select: none;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 30px;
      font-weight: 500;
      letter-spacing: 1px;
    }
    /* Loading Spinner Animation */
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #3498db; /* Professional accent color */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>Webline PMS</h1>
  <div class="spinner"></div>
</body>
</html>
