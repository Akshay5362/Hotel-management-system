services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: hotel_pms_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - guest_documents:/app/guest-documents
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  guest_documents:
    driver: local